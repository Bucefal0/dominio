<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominio Cycling Club | Official Spinning® Facility — Próximamente</title>
  
  <!-- Favicon / Meta -->
  <meta name="description" content="Dominio Cycling Club — Official Spinning® Facility. Estudio de indoor cycling de alto rendimiento. Próximamente.">
  <meta name="theme-color" content="#000000">

  <!-- Google Fonts: Bebas Neue & Work Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       RESET & BASE DESIGN SYSTEM
       Color Palette: Deep Black (#000000), Neon Purple (#9D4EDD)
       ========================================================================== */
    :root {
      --bg-black: #000000;
      --bg-card: rgba(18, 7, 30, 0.65);
      --purple-neon: #9D4EDD;
      --purple-bright: #C77DFF;
      --purple-glow: rgba(157, 78, 221, 0.5);
      --purple-muted: #8a63ad;
      --purple-dark: #240046;
      --text-white: #ffffff;
      --text-muted: rgba(240, 240, 245, 0.72);
      --text-subtle: rgba(200, 190, 220, 0.45);
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Work Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    /* ==========================================================================
       BACKGROUND ATMOSPHERE & HEARTBEAT GLOW
       ========================================================================== */
    .viewport-container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      padding: 2.5rem 1.5rem 2rem 1.5rem;
      z-index: 10;
    }

    /* Ambient Heartbeat Radial Glow */
    .glow-heartbeat {
      position: fixed;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(157, 78, 221, 0.32) 0%, rgba(123, 44, 191, 0.16) 40%, rgba(36, 0, 70, 0.06) 65%, rgba(0, 0, 0, 0) 80%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: heartBeatGlow 4.5s ease-in-out infinite;
      filter: blur(55px);
    }

    .secondary-glow {
      position: fixed;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(199, 125, 255, 0.35) 0%, rgba(157, 78, 221, 0.15) 50%, rgba(0, 0, 0, 0) 75%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: innerPulse 4.5s ease-in-out infinite alternate;
      filter: blur(40px);
    }

    @keyframes heartBeatGlow {
      0% {
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.45;
      }
      22% {
        transform: translate(-50%, -50%) scale(1.18);
        opacity: 0.85;
      }
      38% {
        transform: translate(-50%, -50%) scale(1.02);
        opacity: 0.65;
      }
      52% {
        transform: translate(-50%, -50%) scale(1.22);
        opacity: 0.95;
      }
      75% {
        transform: translate(-50%, -50%) scale(0.98);
        opacity: 0.55;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.45;
      }
    }

    @keyframes innerPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.85);
        opacity: 0.5;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 0.9;
      }
    }

    /* Ambient Canvas for Subtle Energy Particles */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Speed Lines / Decorative Vector Overlay */
    .speed-lines-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.28;
      background-image: 
        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.9) 100%),
        linear-gradient(135deg, rgba(157, 78, 221, 0.04) 25%, transparent 25%),
        linear-gradient(225deg, rgba(157, 78, 221, 0.04) 25%, transparent 25%);
      background-size: 100% 100%, 60px 60px, 60px 60px;
    }

    .svg-track-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.18;
    }

    /* ==========================================================================
       HERO COMPOSITION & CONTENT BLOCKS
       ========================================================================== */
    .hero-wrapper {
      position: relative;
      z-index: 10;
      max-width: 900px;
      width: 100%;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Top Tagline */
    .top-tagline-container {
      animation: fadeInDown 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-bottom: 2rem;
    }

    .top-tagline {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--purple-bright);
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.4rem 1.2rem;
      background: rgba(157, 78, 221, 0.08);
      border: 1px solid rgba(157, 78, 221, 0.22);
      border-radius: 999px;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.12);
      backdrop-filter: blur(8px);
    }

    .top-tagline::before, .top-tagline::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--purple-neon);
      box-shadow: 0 0 8px var(--purple-neon);
    }

    /* Logo Hero Section */
    .logo-container {
      position: relative;
      width: 100%;
      max-width: 580px;
      margin-bottom: 2.2rem;
      animation: logoFadeIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-glow-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      transition: transform 0.4s ease;
    }

    .logo-glow-wrapper:hover {
      transform: scale(1.02);
    }

    .logo-img {
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      filter: drop-shadow(0 0 24px rgba(157, 78, 221, 0.65)) drop-shadow(0 0 60px rgba(157, 78, 221, 0.35));
      animation: logoBreathe 4.5s ease-in-out infinite alternate;
    }

    @keyframes logoFadeIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoBreathe {
      0% {
        filter: drop-shadow(0 0 20px rgba(157, 78, 221, 0.55)) drop-shadow(0 0 50px rgba(157, 78, 221, 0.25));
      }
      100% {
        filter: drop-shadow(0 0 38px rgba(157, 78, 221, 0.88)) drop-shadow(0 0 80px rgba(199, 125, 255, 0.45));
      }
    }

    /* Below Logo: PRÓXIMAMENTE Headline */
    .headline-container {
      margin-bottom: 1rem;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 9.5vw, 6.8rem);
      line-height: 0.95;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 
        0 0 20px rgba(255, 255, 255, 0.3),
        0 0 45px rgba(157, 78, 221, 0.6),
        0 0 90px rgba(157, 78, 221, 0.3);
      position: relative;
    }

    /* Subtitle */
    .subtitle-text {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      max-width: 640px;
      margin: 0 auto 2.8rem auto;
      line-height: 1.6;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    .subtitle-highlight {
      color: #ffffff;
      font-weight: 500;
    }

    /* Official Spinning® Facility Credential Badge */
    .credential-container {
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      margin-bottom: 2rem;
    }

    .credential-badge {
      display: inline-flex;
      align-items: center;
      gap: 1.2rem;
      padding: 0.9rem 1.8rem;
      background: linear-gradient(135deg, rgba(28, 11, 46, 0.82) 0%, rgba(14, 5, 24, 0.9) 100%);
      border: 1px solid rgba(157, 78, 221, 0.45);
      border-radius: 14px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(157, 78, 221, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .credential-badge::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(199, 125, 255, 0.2), transparent);
      transform: skewX(-25deg);
      animation: sheenSweep 6s infinite ease-in-out;
    }

    @keyframes sheenSweep {
      0%, 70% {
        left: -100%;
      }
      100% {
        left: 200%;
      }
    }

    .credential-badge:hover {
      border-color: rgba(199, 125, 255, 0.85);
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.7),
        0 0 35px rgba(157, 78, 221, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* Cyclist / Flywheel Neon Icon */
    .badge-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: radial-gradient(circle, rgba(157, 78, 221, 0.35) 0%, rgba(36, 0, 70, 0.6) 100%);
      border: 1px solid rgba(157, 78, 221, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--purple-bright);
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(157, 78, 221, 0.45);
    }

    .badge-icon-svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px var(--purple-bright));
    }

    .badge-text-box {
      text-align: left;
      display: flex;
      flex-direction: column;
    }

    .badge-subtitle {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--purple-bright);
      font-weight: 600;
    }

    .badge-title {
      font-family: var(--font-display);
      font-size: 1.55rem;
      letter-spacing: 0.12em;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 0 10px rgba(157, 78, 221, 0.6);
    }

    .badge-title span {
      color: var(--purple-bright);
    }

    /* Bottom Minimal Social / Contact Bar */
    .bottom-bar {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding-top: 1.5rem;
      animation: fadeIn 1.5s ease 0.7s both;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--purple-bright);
      box-shadow: 0 0 10px var(--purple-bright);
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.9);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    .social-contact-hint {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .social-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }

    .social-pill:hover {
      background: rgba(157, 78, 221, 0.18);
      border-color: rgba(157, 78, 221, 0.5);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
      transform: translateY(-1px);
    }

    .social-pill:focus-visible {
      outline: 2px solid var(--purple-bright);
      outline-offset: 3px;
    }

    .copyright {
      font-size: 0.72rem;
      color: var(--text-subtle);
      letter-spacing: 0.06em;
      margin-top: 0.25rem;
    }

    /* Keyframe Utilities */
    @keyframes fadeInDown {
      0% {
        opacity: 0;
        transform: translateY(-18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* Responsive Adjustments */
    @media (max-width: 640px) {
      .viewport-container {
        padding: 1.8rem 1rem 1.5rem 1rem;
      }
      .logo-img {
        max-height: 160px;
      }
      .main-title {
        font-size: clamp(2rem, 10vw, 3.5rem);
        letter-spacing: 0.08em;
      }
      .top-tagline {
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        padding: 0.35rem 0.9rem;
      }
      .credential-badge {
        padding: 0.75rem 1.25rem;
        gap: 0.9rem;
      }
      .badge-title {
        font-size: 1.3rem;
      }
      .badge-icon-box {
        width: 38px;
        height: 38px;
      }
      .social-contact-hint {
        flex-direction: column;
        gap: 0.6rem;
      }
    }
  </style>
</head>

  <!-- Ambient Light Streak / Spark Particles Canvas Script -->
  <script>
    (function() {
      const canvas = document.getElementById('ambient-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const PARTICLE_COUNT = 38;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 10;
          this.size = Math.random() * 2 + 0.6;
          this.speedY = -(Math.random() * 0.45 + 0.15);
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.color = Math.random() > 0.4 ? '#9D4EDD' : '#C77DFF';
          this.pulseSpeed = Math.random() * 0.02 + 0.008;
          this.pulse = Math.random() * Math.PI;
        }

        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          this.pulse += this.pulseSpeed;
          this.currentOpacity = this.opacity * (0.6 + 0.4 * Math.sin(this.pulse));

          if (this.y < -10 || this.x < -10 || this.x > width + 10) {
            this.reset();
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color;
          ctx.globalAlpha = Math.max(0, this.currentOpacity);
          ctx.fill();
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>

</body>
</html>
