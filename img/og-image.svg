<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Dominio Cycling Club — Cuauhtémoc, Chihuahua">
  <defs>
    <radialGradient id="glow1" cx="18%" cy="12%" r="55%">
      <stop offset="0" stop-color="#8a19ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a19ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="90%" r="60%">
      <stop offset="0" stop-color="#e600ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e600ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b026ff"/>
      <stop offset="1" stop-color="#ff21e6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#050506"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
