  <text x="600" y="355" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="34" letter-spacing="14" fill="url(#textGrad)" text-anchor="middle">CYCLING CLUB</text>

  <line x1="500" y1="395" x2="700" y2="395" stroke="#b026ff" stroke-width="2" opacity="0.7"/>

  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="6" fill="#e600ff" text-anchor="middle">OFFICIAL SPINNING FACILITY</text>
  <text x="600" y="470" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="22" fill="#a7a7b2" text-anchor="middle">Cuauhtémoc, Chihuahua, México</text>
